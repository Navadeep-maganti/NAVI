services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml_service:
    build: ./ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
      - ml_service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/navi
      - JWT_SECRET=${JWT_SECRET:-replace-with-a-long-random-secret}
      - ML_SERVICE_URL=http://ml_service:8000
      - ML_SERVICE_TIMEOUT_MS=5000
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5000}
      - SMTP_SERVICE=${SMTP_SERVICE:-gmail}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:

